<link rel="stylesheet" href="../tokens.css">

<style>
  html, body { width: 390px; height: 844px; margin: 0; overflow: hidden; }
  .meadow { position: absolute; left: 0; bottom: 0; width: 390px; height: 136px; z-index: 0; pointer-events: none; }
  .meadow .hill-back { fill: var(--kid-meadow); }
  .meadow .hill-front { fill: color-mix(in srgb, var(--kid-meadow) 80%, var(--surface)); }
  .meadow, .sparks, .confetti, .burst { position: absolute; z-index: 0; pointer-events: none; }
  .screen.kid > .scroll, .screen.kid > .kid-bar, .screen.kid > .k3-dock, .screen.kid > .home-indicator { position: relative; z-index: 1; }
  .lock-btn.lg, .nav-back.lg { width: 56px; height: 56px; min-width: 56px; min-height: 56px; border-radius: 18px; }
  .kid-bar { background: var(--surface); border-top: 3px solid var(--ink); padding: 12px 20px 10px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
  .kcap { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 20px; color: var(--ink-2); }

  .k8-top { display: flex; align-items: center; gap: 10px; padding: 0 20px 6px; flex-shrink: 0; }
  .k8-top .lock-btn { margin-left: auto; }
  .k8-head { display: flex; align-items: center; gap: 10px; }
  .k8-head h1 { flex: 1; min-width: 0; }
  .k8-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .k8-card { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--sh-kid); padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .k8-art { width: 56px; height: 56px; border-radius: 999px; background: var(--coin-tint); color: var(--coin-ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .k8-n { font-family: var(--font-display); font-weight: 800; font-size: 15px; line-height: 19px; text-align: center; min-height: 40px; display: flex; align-items: center; justify-content: center; }
  .k8-p { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 900; font-size: 16px; line-height: 1; color: var(--coin-ink); }
  .k8-p img { width: 20px; height: 20px; }
  .k8-note { font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 18px; text-align: center; color: var(--ink-2); }
  .k8-scroll { padding-bottom: calc(var(--home-h) + var(--s6)); }
  .k8-get { width: 100%; min-height: 56px; border-radius: var(--r-m); border: 3px solid var(--ink); background: var(--leaf); color: var(--surface); font-family: var(--font-display); font-weight: 900; font-size: 17px; cursor: pointer; box-shadow: var(--sh-kid); }
  .k8-get.off { background: var(--surface-2); color: var(--ink-2); }
  .k8-foot { text-align: center; }
</style>
</head>
