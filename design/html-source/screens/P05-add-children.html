<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Who&rsquo;s in your nest? &middot; Nestling</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
html, body { width: 390px; height: 844px; margin: 0; overflow: hidden; }

html, body { width: 390px; height: 844px; margin: 0; overflow: hidden; }
.head h1 { display: block; }
.head p { margin-top: 8px; }
.scroll > .kid-grid { margin-top: 14px; }
.scroll > .form-card { margin-top: 12px; }
.kid-grid { display: grid; grid-template-columns: 170px 170px; gap: 10px; }
.kid-card { position: relative; padding: 12px 10px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.kid-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 24px; color: var(--ink); }
.kid-age { font-size: 13px; line-height: 18px; color: var(--ink-2); margin-top: 4px; }
.edit { position: absolute; top: 1px; right: 1px; width: 44px; height: 44px; min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: var(--ink-3); border-radius: 12px; cursor: pointer; }
.form-card { padding: 14px; }
.form-card .h3 { display: block; }
.add-another { min-height: 48px; }
.form-card .field { margin-top: 10px; }
.form-card .lbl { font-size: 13px; font-weight: 600; line-height: 18px; color: var(--ink-2); margin-top: 8px; }
.form-card .chip-row { margin-top: 4px; }
.swatches { display: flex; gap: 8px; margin-top: 4px; }
.sw { width: 44px; height: 44px; min-width: 44px; min-height: 44px; border-radius: 50%; display: block; }
.sw.a-lilac { background: var(--lilac); }
.sw.a-peach { background: var(--peach); }
.sw.a-sky { background: var(--sky); }
.sw.a-leaf { background: var(--leaf); }
.sw.a-coin { background: var(--coin); }
.sw.on { box-shadow: 0 0 0 3px var(--ink); }
.form-note { margin-top: 6px; }
</style>
</head>
<body>
<div class="screen parent"><div class="status-bar"><span class="status-time">9:41</span><span class="status-icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.5a10 10 0 0 1 13 0"/><path d="M4 7.2a5.6 5.6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="20" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg></span></div>
  <nav class="nav-bar compact" aria-label="Add children">
    <button class="nav-back" type="button" aria-label="Back"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button>
  </nav>
  <div class="scroll">
    <div class="head">
      <h1 class="h1">Who&rsquo;s in your nest?</h1>
      <p class="body t-ink-2">Nicknames only &mdash; no photos, no email.</p>
    </div>
    <div class="kid-grid">
      <div class="card kid-card">
            <button class="edit" type="button" aria-label="Edit Maya"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19.2 8.8a2.6 2.6 0 0 0-3.7-3.7L4 16.4V20z"/></svg></button>
            <span class="avatar s44 a-lilac" aria-hidden="true">M</span>
            <span class="kid-name">Maya</span>
            <span class="kid-age">Age 7&ndash;9</span>
          </div>
      <div class="card kid-card">
            <button class="edit" type="button" aria-label="Edit Leo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19.2 8.8a2.6 2.6 0 0 0-3.7-3.7L4 16.4V20z"/></svg></button>
            <span class="avatar s44 a-peach" aria-hidden="true">L</span>
            <span class="kid-name">Leo</span>
            <span class="kid-age">Age 4&ndash;6</span>
          </div>
    </div>
    <div class="card form-card">
      <p class="h3">Add a child</p>
      <div class="field">
        <label for="nickname">Nickname</label>
        <input id="nickname" type="text" placeholder="e.g. Ollie" autocomplete="off" autofocus aria-label="Child nickname">
      </div>
      <p class="lbl">Age band</p>
      <div class="chip-row" role="group" aria-label="Age band">
        <span class="chip">4&ndash;6</span>
        <span class="chip selected">7&ndash;9</span>
        <span class="chip">10&ndash;12</span>
        <span class="chip">13+</span>
      </div>
      <p class="lbl">Avatar colour</p>
      <div class="swatches" role="group" aria-label="Avatar colour">
        <span class="sw a-lilac"></span>
        <span class="sw a-peach on" aria-hidden="true"></span>
        <span class="sw a-sky"></span>
        <span class="sw a-leaf"></span>
        <span class="sw a-coin"></span>
      </div>
      <p class="caption form-note">We only ask for an age range so quests suit them.</p>
    </div>
  </div>
  <div class="bottom-cta">
    <button class="btn btn-secondary add-another" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add another child</span></button>
    <button class="btn btn-primary" type="button">Continue</button>
    <p class="caption">You can change any of this later in Family.</p>
  </div>
<div class="home-indicator" aria-hidden="true"><span class="home-pill"></span></div>
</div>
</body>
</html>
