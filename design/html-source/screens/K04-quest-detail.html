<meta name="viewport" content="width=390, initial-scale=1">
<title>Kid mode — Tidy your bedroom · Nestling</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  html, body { width: 390px; height: 844px; margin: 0; overflow: hidden; }
  .meadow { position: absolute; left: 0; bottom: 0; width: 390px; height: 136px; z-index: 0; pointer-events: none; }
  .meadow .hill-back { fill: var(--kid-meadow); }
  .meadow .hill-front { fill: color-mix(in srgb, var(--kid-meadow) 80%, var(--surface)); }
  .meadow, .sparks, .confetti, .burst { position: absolute; z-index: 0; pointer-events: none; }
  .screen.kid > .scroll, .screen.kid > .kid-bar, .screen.kid > .k3-dock, .screen.kid > .home-indicator { position: relative; z-index: 1; }
  .lock-btn.lg, .nav-back.lg { width: 56px; height: 56px; min-width: 56px; min-height: 56px; border-radius: 18px; }
  .kid-bar { background: var(--surface); border-top: 3px solid var(--ink); padding: 12px 20px 10px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
  .kcap { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 20px; color: var(--ink-2); }
  .kchip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--leaf-tint); color: var(--leaf-ink); font-family: var(--font-display); font-weight: 800; font-size: 15px; line-height: 1; white-space: nowrap; }
  .grow { flex: 1; min-height: 0; }

  .k4-top { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 6px; flex-shrink: 0; }
  .k4-tile { width: 120px; height: 120px; margin: 0 auto; border-radius: var(--r-l); background: var(--peach-tint); border: 3px solid var(--ink); box-shadow: var(--sh-kid); display: flex; align-items: center; justify-content: center; }
  .k4-h { text-align: center; }
  .k4-title { margin-top: 4px; }
  .k4-rew { display: flex; justify-content: center; }
  .k4-steps { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--sh-kid); overflow: hidden; }
  .k4-step { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: transparent; border: 0; cursor: pointer; text-align: left; }
  .k4-step + .k4-step { border-top: 2px solid var(--line); }
  .k4-dot { width: 40px; height: 40px; min-width: 40px; border-radius: 999px; border: 3px solid var(--ink); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
  .k4-dot.on { background: var(--leaf); color: var(--on-leaf); }
  .k4-step-t { font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 24px; color: var(--ink); min-width: 0; }
  .k4-hint { text-align: center; }
  .k4-cheer { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 22px; }
  .k4-cheer img { width: 64px; height: 64px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="screen kid">
<svg class="meadow" viewBox="0 0 390 136" preserveAspectRatio="none" aria-hidden="true"><path class="hill-back" d="M0 56C58 28 122 32 186 22 252 12 314 28 390 10v126H0Z"/><path class="hill-front" d="M0 92c74-22 138-10 214-22 60-10 112 4 176-14v80H0Z"/></svg>
<div class="status-bar"><span class="status-time">9:41</span><span class="status-icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.5a10 10 0 0 1 13 0"/><path d="M4 7.2a5.6 5.6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="20" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg></span></div>
  <div class="k4-top"><button class="nav-back lg" type="button" aria-label="Back"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button><button class="lock-btn lg" type="button" aria-label="Grown-ups"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button></div>
  <div class="scroll">
    <div class="k4-tile"><svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18v-7"/><path d="M2 14h20v4"/><path d="M22 18v-4a3 3 0 0 0-3-3h-9v3"/><path d="M6 11V8h4v3"/></svg></div>
    <h1 class="kid-title k4-h k4-title">Tidy your bedroom</h1>
    <div class="k4-rew"><span class="coin-pill big"><img src="../assets/coin.svg" alt="">+15</span></div>
    <p class="kcap k4-hint">Tick each bit off, then press the big button.</p>
    <div class="k4-steps">
      <button class="k4-step" type="button" aria-pressed="true"><span class="k4-dot on"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span><span class="k4-step-t">Clothes in the basket</span></button>
      <button class="k4-step" type="button" aria-pressed="true"><span class="k4-dot on"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span><span class="k4-step-t">Toys in the box</span></button>
      <button class="k4-step" type="button" aria-pressed="false"><span class="k4-dot"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span><span class="k4-step-t">Books on the shelf</span></button>
    </div>
    <div class="k4-cheer">
      <img src="../assets/pip-stage-3.svg" alt="Pip cheering you on">
      <span class="speech">Pip is doing a happy dance!</span>
    </div>
  </div>
  <div class="kid-bar">
    <button class="btn-kid leaf" type="button"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg><span>I did it!</span></button>
    <button class="btn-kid white" type="button">Back</button>
  </div>
  <div class="home-indicator" aria-hidden="true"><span class="home-pill"></span></div>
</div>
</body>
</html>
