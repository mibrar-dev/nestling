<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Kid mode — Pip's nest · Nestling</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  html, body { width: 390px; height: 844px; margin: 0; overflow: hidden; }
  .meadow { position: absolute; left: 0; bottom: 0; width: 390px; height: 136px; z-index: 0; pointer-events: none; }
  .meadow .hill-back { fill: var(--kid-meadow); }
  .meadow .hill-front { fill: color-mix(in srgb, var(--kid-meadow) 80%, var(--surface)); }
  .meadow, .sparks, .confetti, .burst { position: absolute; z-index: 0; pointer-events: none; }
  .screen.kid > .scroll, .screen.kid > .kid-bar, .screen.kid > .k3-dock, .screen.kid > .home-indicator { position: relative; z-index: 1; }
  .lock-btn.lg, .nav-back.lg { width: 56px; height: 56px; min-width: 56px; min-height: 56px; border-radius: 18px; }
  .kid-bar { background: var(--surface); border-top: 3px solid var(--ink); padding: 12px 20px 10px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
  .kcap { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 20px; color: var(--ink-2); }

  .k6-top { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 4px; flex-shrink: 0; }
  .k6-name { text-align: center; }
  .k6-scroll { padding-bottom: calc(var(--home-h) + var(--s6)); }
  .k6-pet { position: relative; width: 230px; height: 206px; margin: 9px auto 0; }
  .k6-pet .nest { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 230px; height: 206px; }
  .k6-pet .pip { position: absolute; left: 50%; bottom: 81px; transform: translateX(-50%); width: 134px; height: 134px; }
  .k6-grow { background: var(--lilac-tint); border: 3px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--sh-kid); padding: 12px 14px; }
  .k6-grow-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .k6-grow-top img { width: 30px; height: 30px; flex-shrink: 0; }
  .k6-grow-top strong { font-family: var(--font-display); font-weight: 900; font-size: 18px; line-height: 24px; }
  .k6-count { display: flex; justify-content: space-between; margin-top: 8px; }
  .k6-care { display: flex; gap: 12px; }
  .k6-care .btn-kid { flex: 1; min-width: 0; flex-direction: column; gap: 3px; min-height: 88px; padding: 8px 4px; font-size: 17px; line-height: 20px; }
  .k6-coin { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 800; line-height: 1; }
  .k6-coin img { width: 16px; height: 16px; }
  .k6-free { font-size: 13px; font-weight: 800; line-height: 1; color: var(--ink); background: var(--surface); border-radius: 999px; padding: 3px 8px; }
  .k6-sec { font-family: var(--font-display); font-weight: 900; font-size: 20px; line-height: 26px; }
  .k6-ward { display: flex; gap: 12px; }
  .k6-ward > * { flex: 1; min-width: 0; }
  .k6-item { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--sh-kid); padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-family: var(--font-display); }
  .k6-item.locked { background: var(--surface-2); border-style: dashed; border-color: var(--ink-2); box-shadow: none; color: var(--ink-2); }
  .k6-item-art { width: 52px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: var(--lilac-tint); color: var(--ink); }
  .k6-item.locked .k6-item-art { background: var(--surface); color: var(--ink-2); }
  .k6-item-n { font-weight: 800; font-size: 14px; line-height: 18px; text-align: center; }
  .k6-item-p { display: inline-flex; align-items: center; gap: 4px; font-weight: 900; font-size: 14px; line-height: 1; }
  .k6-item-p img { width: 16px; height: 16px; }
  .k6-item-p.on { color: var(--leaf-ink); }
</style>
</head>
<body>
<div class="screen kid">
<svg class="meadow" viewBox="0 0 390 136" preserveAspectRatio="none" aria-hidden="true"><path class="hill-back" d="M0 56C58 28 122 32 186 22 252 12 314 28 390 10v126H0Z"/><path class="hill-front" d="M0 92c74-22 138-10 214-22 60-10 112 4 176-14v80H0Z"/></svg>
<div class="status-bar"><span class="status-time">9:41</span><span class="status-icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.5a10 10 0 0 1 13 0"/><path d="M4 7.2a5.6 5.6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="20" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg></span></div>
  <div class="k6-top"><button class="nav-back lg" type="button" aria-label="Back"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button><button class="lock-btn lg" type="button" aria-label="Grown-ups"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button></div>
  <div class="scroll k6-scroll">
    <h1 class="kid-title k6-name">Pip &middot; Fledgling</h1>
    <div class="k6-pet">
      <img class="nest" src="../assets/nest.svg" alt="">
      <img class="pip" src="../assets/pip-stage-3.svg" alt="Pip the Fledgling in her nest">
    </div>
    <div class="k6-grow">
      <div class="k6-grow-top">
        <img src="../assets/pip-stage-4.svg" alt="">
        <strong>Growing into a Songbird</strong>
      </div>
      <div class="progress kid" role="img" aria-label="Pip is 70% of the way to Songbird"><span style="width:70%"></span></div>
      <div class="k6-count"><span class="kcap">175 coins</span><span class="kcap">250 to grow</span></div>
    </div>
    <div class="k6-care">
      <button class="btn-kid peach" type="button"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M12 11V5"/><path d="M9 5a3 3 0 0 1 6 0"/></svg><span>Feed</span><span class="k6-coin"><img src="../assets/coin.svg" alt="">5</span></button>
      <button class="btn-kid sky" type="button"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5 7.5c4 1 7 3.5 8 7.5M19 7.5c-4 1-7 3.5-8 7.5"/></svg><span>Play</span><span class="k6-free">Free</span></button>
      <button class="btn-kid white" type="button"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="15" r="5"/><circle cx="16" cy="9.5" r="3.5"/><circle cx="16.5" cy="17.5" r="2.5"/></svg><span>Bath</span><span class="k6-coin"><img src="../assets/coin.svg" alt="">3</span></button>
    </div>
    <div class="k6-sec">Pip's wardrobe</div>
    <div class="k6-ward">
      <button class="k6-item" type="button"><span class="k6-item-art"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4v18H5z"/><path d="M11 3h4v5a2 2 0 0 1-4 0z"/><path d="M7 9v6"/></svg></span><span class="k6-item-n">Scarf</span><span class="k6-item-p on">Owned</span></button>
      <button class="k6-item" type="button"><span class="k6-item-art"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16h18l-1.6 2.4H4.6z"/><path d="M7 16a5 5 0 0 1 10 0z"/></svg></span><span class="k6-item-n">Sun hat</span><span class="k6-item-p on">Owned</span></button>
      <button class="k6-item locked" type="button"><span class="k6-item-art"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v8l-2 4.2A3 3 0 0 0 8.7 20h5.6A2.4 2.4 0 0 0 16.6 15l-2.6-4V3z"/><path d="M6 3h4M14 3h4"/></svg></span><span class="k6-item-n">Wellies</span><span class="k6-item-p"><img src="../assets/coin.svg" alt="">30</span></button>
      <button class="k6-item locked" type="button"><span class="k6-item-art"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8l3.6 3L12 5l4.4 6L20 8l-1.6 9H5.6z"/><path d="M6 20h12"/></svg></span><span class="k6-item-n">Crown</span><span class="k6-item-p"><img src="../assets/coin.svg" alt="">60</span></button>
    </div>
    <p class="kcap" style="text-align:center">Nothing here is a chore &mdash; it is all just for fun.</p>
  </div>
  <div class="home-indicator" aria-hidden="true"><span class="home-pill"></span></div>
</div>
</body>
</html>
