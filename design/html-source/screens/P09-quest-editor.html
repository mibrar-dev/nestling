<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1"><title>New quest — Nestling</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><style>
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 8px}
.sheet-top .t{font-family:var(--font-display);font-weight:800;font-size:18px;line-height:24px}
.cancel{min-width:44px;min-height:44px;background:none;border:0;color:var(--ink-2);font-weight:600;font-size:16px;cursor:pointer}
.save{min-width:64px;min-height:44px;background:var(--leaf);color:var(--surface);border:0;border-radius:999px;font-weight:700;font-size:16px;padding:0 18px;cursor:pointer}
.lbl{font-size:13px;font-weight:600;color:var(--ink-2);line-height:18px;margin-bottom:6px;display:block}
.icons{display:grid;grid-template-columns:repeat(6,44px);gap:8px;justify-content:space-between}
.ic{width:44px;height:44px;min-width:44px;min-height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2)}
.ic.sel{border-color:var(--leaf);background:var(--leaf-tint);color:var(--leaf-ink)}
.who{display:flex;gap:8px;flex-wrap:wrap}
.person{display:inline-flex;align-items:center;gap:8px;height:48px;padding:4px 14px 4px 4px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer;min-height:48px}
.person.sel{border-color:var(--leaf);background:var(--leaf-tint);color:var(--leaf-ink)}
.dayrow{display:flex;gap:6px;margin-top:8px;flex-wrap:nowrap;justify-content:space-between}
.day{width:44px;height:44px;min-width:44px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;color:var(--ink-2);padding:0}
.day.sel{background:var(--hero-bg);color:var(--on-hero);border-color:var(--hero-bg)}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switchrow .tt{font-weight:600;font-size:16px;line-height:22px}
.switchrow .ss{font-size:13px;line-height:18px;color:var(--ink-2);white-space:nowrap}
.stepper{flex-shrink:0}
.due{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.due .v{font-weight:600;font-size:15px}
</style></head><body><div class="screen parent">
<div class="status-bar"><span class="status-time">9:41</span><span class="status-icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.5a10 10 0 0 1 13 0"/><path d="M4 7.2a5.6 5.6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="20" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg></span></div>
<div class="scroll" style="background:var(--surface-2);padding:0 0 32px">
<div class="sheet" style="position:static;max-height:none;border-radius:var(--r-xl) var(--r-xl) 0 0;min-height:100%">
<div class="sheet-top"><button class="cancel" type="button">Cancel</button><span class="t">New quest</span><button class="save" type="button">Save</button></div>
<div class="field"><label for="qname">Quest name</label><input id="qname" type="text" value="Hoover the stairs"></div>
<div><span class="lbl">Icon</span><div class="icons" role="radiogroup" aria-label="Quest icon">
<span class="ic" role="radio" aria-checked="false" tabindex="0" aria-label="Bed"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8"/><path d="M3 18h18"/></svg></span>
<span class="ic" role="radio" aria-checked="false" tabindex="0" aria-label="Dishes"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9z"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
<span class="ic sel" role="radio" aria-checked="true" tabindex="0" aria-label="Hoover"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="8" rx="2"/><path d="M16 12h3a2 2 0 0 0 2-2V7a2 2 0 0 0-4 0M7 16v3M11 16v3"/></svg></span>
<span class="ic" role="radio" aria-checked="false" tabindex="0" aria-label="Book"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13"/></svg></span>
<span class="ic" role="radio" aria-checked="false" tabindex="0" aria-label="Bins"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13v9H3zM7 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 12h4"/></svg></span>
<span class="ic" role="radio" aria-checked="false" tabindex="0" aria-label="Paw"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="3.5"/><circle cx="7" cy="9" r="1.4"/><circle cx="11" cy="7" r="1.4"/><circle cx="15" cy="8.5" r="1.4"/><circle cx="17.5" cy="11.5" r="1.4"/></svg></span>
</div></div>
<div><span class="lbl">Who's it for?</span><div class="who"><button class="person sel" type="button"><span class="avatar s32 a-lilac">M</span>Maya</button><button class="person" type="button"><span class="avatar s32 a-peach">L</span>Leo</button><button class="person" type="button">Anyone</button></div></div>
<div class="card inset" style="margin-top:16px"><div class="switchrow"><div style="min-width:0"><div class="tt">Reward</div><div class="ss">= 15p at payout</div></div><div class="stepper"><button type="button" aria-label="Decrease reward">−</button><span class="step-val num">15</span><button type="button" aria-label="Increase reward">+</button></div></div></div>
<div style="margin-top:16px"><span class="lbl">Repeats</span><div class="segmented" role="tablist"><button type="button" role="tab" aria-selected="false">Once</button><button type="button" role="tab" aria-selected="false">Daily</button><button type="button" role="tab" aria-selected="true" class="selected">Weekly</button></div><div class="dayrow"><button class="day" type="button">M</button><button class="day" type="button">T</button><button class="day" type="button">W</button><button class="day" type="button">T</button><button class="day" type="button">F</button><button class="day sel" type="button" aria-pressed="true">S</button><button class="day" type="button">S</button></div></div>
<div class="card" style="margin-top:16px"><div class="switchrow"><div><div class="tt">Needs my approval</div><div class="ss" style="white-space:normal">Coins land after your thumbs-up</div></div><input class="toggle" type="checkbox" checked aria-label="Needs my approval"></div></div>
<div class="card" style="margin-top:12px"><div class="due"><span class="tt" style="font-weight:600">Due by</span><span class="v">Before tea (5pm) <span style="color:var(--ink-3)">›</span></span></div></div>
</div>
</div>
<div class="home-indicator" aria-hidden="true"><span class="home-pill"></span></div>
</div></body></html>
