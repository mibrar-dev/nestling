<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Create your family account &middot; Nestling</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
html, body { width: 390px; height: 844px; margin: 0; overflow: hidden; }
.head h1 { display: block; }
.head p { margin-top: 8px; }
.scroll > .btn-apple { margin-top: 24px; }
.scroll > .btn-google { margin-top: 12px; }
.scroll > .or-row { margin-top: 16px; }
.scroll > .field { margin-top: 16px; }
.pw-wrap { position: relative; }
.field .pw-wrap input { padding-right: 52px; }
.eye { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: var(--ink-2); border-radius: 12px; cursor: pointer; }
.or-row { display: flex; align-items: center; gap: 12px; }
.or-row .rule { flex: 1; min-width: 0; height: 1px; background: var(--line); }
.or-row .or-label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.note { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 15px; line-height: 22px; font-weight: 600; color: var(--ink-2); }
.note svg { flex-shrink: 0; color: var(--lilac); }
.legal { white-space: normal; text-align: center; }
.link { display: inline-block; min-width: 44px; min-height: 44px; padding: 12px 2px; margin: -12px 0; font-family: var(--font-ui); font-size: 13px; font-weight: 600; line-height: 20px; color: var(--sky); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
</style>
</head>
<body>

  <div class="scroll">
    <div class="head">
      <h1 class="h1">Create your family account</h1>

    <button class="btn btn-google" type="button"><svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Continue with Google</span></button>
    <div class="or-row" aria-hidden="true">
      <span class="rule"></span><span class="or-label">or</span><span class="rule"></span>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" value="sarah@example.co.uk" autocomplete="email" spellcheck="false">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" type="password" value="nestlingfamily2026" autocomplete="new-password">
        <button class="eye" type="button" aria-label="Show password">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <span class="helper">At least 8 characters</span>
    </div>
    <p class="note">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5.5c0 4.3 2.9 7.9 7 9.5 4.1-1.6 7-5.2 7-9.5V6l-7-3z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg>
      <span>No child emails or photos &mdash; ever.</span>
    </p>
  </div>
  <div class="bottom-cta">
    <button class="btn btn-primary" type="button">Create account</button>
    <p class="caption legal">By continuing you agree to our <a class="link" href="#">Terms</a> and <a class="link" href="#">Privacy Notice</a></p>
  </div>
<div class="home-indicator" aria-hidden="true"><span class="home-pill"></span></div>
</div>
</body>
