<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Kid mode — Secret code · Nestling</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  html, body { width: 390px; height: 844px; margin: 0; overflow: hidden; }
  .meadow { position: absolute; left: 0; bottom: 0; width: 390px; height: 136px; z-index: 0; pointer-events: none; }
  .meadow .hill-back { fill: var(--kid-meadow); }
  .meadow .hill-front { fill: color-mix(in srgb, var(--kid-meadow) 80%, var(--surface)); }
  .meadow, .sparks, .confetti, .burst { position: absolute; z-index: 0; pointer-events: none; }
  .screen.kid > .scroll, .screen.kid > .kid-bar, .screen.kid > .k3-dock, .screen.kid > .home-indicator { position: relative; z-index: 1; }
  .lock-btn.lg, .nav-back.lg { width: 56px; height: 56px; min-width: 56px; min-height: 56px; border-radius: 18px; }
  .kid-bar { background: var(--surface); border-top: 3px solid var(--ink); padding: 12px 20px 10px; flex-shrink: 0; display: flex; gap: 10px; }
  .kcap { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 20px; color: var(--ink-2); }
  .kchip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--leaf-tint); color: var(--leaf-ink); font-family: var(--font-display); font-weight: 800; font-size: 15px; line-height: 1; white-space: nowrap; }
  .grow { flex: 1; min-height: 0; }

  .k2-top { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 6px; flex-shrink: 0; }
  .k2-body { display: flex; flex-direction: column; align-items: center; gap: 20px; min-height: 100%; }
  .k2-ava { position: relative; width: 128px; height: 128px; border-radius: 999px; background: var(--lilac-tint); display: flex; align-items: center; justify-content: center; }
  .k2-hi { text-align: center; }
  .k2-hi .mark { display: inline-block; font-family: var(--font-display); font-weight: 900; font-size: 16px; line-height: 22px; letter-spacing: .08em; color: var(--ink); background: var(--lilac-tint); border-radius: 999px; padding: 2px 12px; }
  .k2-hi .say { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 26px; color: var(--ink); margin-top: 2px; }
</style>
</head>
<body>
<div class="screen kid">
<svg class="meadow" viewBox="0 0 390 136" preserveAspectRatio="none" aria-hidden="true"><path class="hill-back" d="M0 56C58 28 122 32 186 22 252 12 314 28 390 10v126H0Z"/><path class="hill-front" d="M0 92c74-22 138-10 214-22 60-10 112 4 176-14v80H0Z"/></svg>
<div class="status-bar"><span class="status-time">9:41</span><span class="status-icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.5a10 10 0 0 1 13 0"/><path d="M4 7.2a5.6 5.6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="20" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg></span></div>
  <div class="k2-top"><button class="nav-back lg" type="button" aria-label="Back"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button><button class="lock-btn lg" type="button" aria-label="Grown-ups"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button></div>
  <div class="scroll">
    <div class="k2-body">
      <div class="k2-ava"><span class="avatar a-lilac s96">M</span></div>
      <div class="k2-hi">
        <div class="mark">NESTLING</div>
        <div class="say">Hi Maya! Enter your secret code</div>
      </div>
      <div class="pin-dots" aria-label="Two of four digits entered"><span class="filled"></span><span class="filled"></span><span></span><span></span></div>
      <div class="keypad" role="group" aria-label="Number pad"><button type="button">1</button><button type="button">2</button><button type="button">3</button><button type="button">4</button><button type="button">5</button><button type="button">6</button><button type="button">7</button><button type="button">8</button><button type="button">9</button><span class="keypad-blank"></span><button type="button">0</button><button type="button" aria-label="Delete">&#9003;</button></div>
      <p class="kcap" style="text-align:center">Forgot it? Just ask a grown-up.</p>
    </div>
  </div>
  <div class="home-indicator" aria-hidden="true"><span class="home-pill"></span></div>
</div>
</body>
</html>
