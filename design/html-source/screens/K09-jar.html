<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Kid mode — My jar · Nestling</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  html, body { width: 390px; height: 844px; margin: 0; overflow: hidden; }
  .meadow { position: absolute; left: 0; bottom: 0; width: 390px; height: 136px; z-index: 0; pointer-events: none; }
  .meadow .hill-back { fill: var(--kid-meadow); }
  .meadow .hill-front { fill: color-mix(in srgb, var(--kid-meadow) 80%, var(--surface)); }
  .meadow, .sparks, .confetti, .burst { position: absolute; z-index: 0; pointer-events: none; }
  .screen.kid > .scroll, .screen.kid > .kid-bar, .screen.kid > .k3-dock, .screen.kid > .home-indicator { position: relative; z-index: 1; }
  .lock-btn.lg, .nav-back.lg { width: 56px; height: 56px; min-width: 56px; min-height: 56px; border-radius: 18px; }
  .kid-bar { background: var(--surface); border-top: 3px solid var(--ink); padding: 12px 20px 10px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
  .kcap { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 20px; color: var(--ink-2); }
  .krow-top { display: flex; align-items: center; gap: 10px; padding: 0 20px 4px; flex-shrink: 0; }
  .krow-top .lock-btn { margin-left: auto; }

  .k9-head { text-align: center; }
  .jar { width: 186px; height: 220px; margin: 10px auto 0; display: block; }
  .k9-amt { text-align: center; margin-top: 6px; }
  .k9-amt .money { font-size: 40px; line-height: 44px; }
  .k9-when { text-align: center; margin-top: 2px; }
  .k9-goal { background: var(--coin-tint); border: 3px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--sh-kid); padding: 14px 16px; }
  .k9-goal h2 { font-family: var(--font-display); font-weight: 900; font-size: 20px; line-height: 26px; }
  .k9-goal-top { display: flex; align-items: center; gap: 10px; }
  .k9-goal-top img { width: 34px; height: 34px; flex-shrink: 0; }
  .k9-goal-top h2 { flex: 1; min-width: 0; }
  .k9-amts { display: flex; justify-content: space-between; margin: 12px 0 6px; }
  .k9-amts b { font-family: var(--font-display); font-weight: 900; font-size: 17px; }
  .k9-list { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--sh-kid); overflow: hidden; }
  .k9-row { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px; position: relative; }
  .k9-row + .k9-row::before { content: ""; position: absolute; top: 0; left: 66px; right: 0; height: 2px; background: var(--line); }
  .k9-ico { width: 40px; height: 40px; min-width: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: var(--leaf-tint); color: var(--leaf-ink); }
  .k9-main { flex: 1; min-width: 0; }
  .k9-t { font-family: var(--font-display); font-weight: 800; font-size: 17px; line-height: 22px; }
  .k9-s { font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 18px; color: var(--ink-2); }
  .k9-v { font-family: var(--font-display); font-weight: 900; font-size: 18px; line-height: 22px; color: var(--leaf-ink); white-space: nowrap; }
</style>
</head>
<body>
<div class="screen kid">

<div class="status-bar"><span class="status-time">9:41</span><span class="status-icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.5a10 10 0 0 1 13 0"/><path d="M4 7.2a5.6 5.6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="20" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg></span></div>
  <div class="krow-top"><button class="nav-back lg" type="button" aria-label="Back"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button><button class="lock-btn lg" type="button" aria-label="Grown-ups"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button></div>
  <div class="scroll">

  <path d="M134 44v12M128 50h12" stroke="#7C6CF2" stroke-width="4" stroke-linecap="round"/></svg>
    <div class="k9-amt"><span class="kid-hero money">£4.20</span></div>
    <p class="kid-body k9-when">coming on Saturday</p>
    <div class="k9-goal">
      <div class="k9-goal-top">
        <img src="../assets/coin.svg" alt="">

        <b class="money">£15.50</b>

      </div>
      <div class="progress kid" role="img" aria-label="62% of the Lego Friends set saved"><span style="width:62%"></span></div>
      <div class="k9-amts" style="margin:8px 0 0"><span class="kcap">of £24.99</span><span class="kcap">62% there!</span></div>
    </div>
    <h2 class="kid-title" style="font-size:20px;line-height:26px">What went in</h2>
    <div class="k9-list">
      <div class="k9-row">
        <span class="k9-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 9.5h5M9.5 14.5h5"/></svg></span>

        <span class="k9-ico" style="background:var(--peach-tint);color:var(--ink)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 13h18M12 9v12"/><path d="M12 9S9.5 3 7 3a2.2 2.2 0 0 0 0 6M12 9s2.5-6 5-6a2.2 2.2 0 0 1 0 6"/></svg></span>
        <div class="k9-main"><div class="k9-t">Birthday money</div><div class="k9-s">From Mum</div></div>
        <span class="k9-v money">+£10.00</span>
      </div>
    </div>
    <p class="kcap" style="text-align:center">Mum keeps the real money. This jar just shows how well you have done.</p>
  </div>
  <div class="home-indicator" aria-hidden="true"><span class="home-pill"></span></div>
</div>
