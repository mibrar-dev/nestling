<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Grown-ups only &middot; Nestling</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
html, body { width: 390px; height: 844px; margin: 0; overflow: hidden; }
.kid-bg { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 28px; overflow: hidden; }
.kb-top { display: flex; align-items: center; gap: 12px; padding-top: 8px; }
.kb-hi { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 900; font-size: 28px; line-height: 34px; color: var(--ink); }
.kb-pet { margin-top: 26px; display: flex; align-items: center; justify-content: center; }
.kb-pet img { width: 200px; height: 200px; }
.home-indicator { position: relative; z-index: 31; }
.gate { padding-top: 24px; }
.lock-tile { width: 52px; height: 52px; border-radius: 16px; background: var(--lilac-tint); color: var(--lilac); display: inline-flex; align-items: center; justify-content: center; }
.gate .h2 { display: block; margin-top: 12px; }
.gate .gate-instr { display: block; margin-top: 8px; }
.gate .gate-q { display: block; margin-top: 4px; }
.keypad button.del { display: inline-flex; align-items: center; justify-content: center; }
.digits { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
.digit { width: 56px; height: 64px; border-radius: var(--r-m); border: 2px solid var(--line); background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 900; font-size: 28px; line-height: 1; color: var(--ink); position: relative; }
.digit.filled { background: var(--surface); border-color: var(--ink); }
.digit.empty::after { content: ""; position: absolute; left: 50%; top: 50%; width: 3px; height: 24px; margin: -12px 0 0 -1.5px; border-radius: 2px; background: var(--leaf); }
.gate .keypad { margin-top: 16px; }
.gate .cancel { min-height: 56px; margin-top: 12px; font-size: 15px; }
.gate .gate-note { display: block; margin-top: 10px; }
</style>
</head>
<body>
<div class="screen kid">
  <div class="status-bar"><span class="status-time">9:41</span><span class="status-icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.5a10 10 0 0 1 13 0"/><path d="M4 7.2a5.6 5.6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="20" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg></span></div>
  <div class="kid-bg" aria-hidden="true">
    <div class="kb-top">
      <span class="avatar s44 a-lilac">M</span>
      <span class="kb-hi">Hi Maya!</span>
      <span class="coin-pill"><img src="../assets/coin.svg" alt="">120</span>
    </div>
    <div class="kb-pet"><img src="../assets/pip-stage-3.svg" alt=""></div>
  </div>
  <div class="scrim"></div>
  <div class="modal gate" role="dialog" aria-modal="true" aria-label="Parental gate">
    <span class="lock-tile" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
    </span>
    <h2 class="h2">Grown-ups only</h2>
    <p class="gate-instr body-s t-ink-2">Type the answer in numbers:</p>
    <p class="gate-q h3">seven times six</p>
    <div class="digits" role="group" aria-label="Answer, 4 of 42 entered">
      <span class="digit filled">4</span><span class="digit empty"></span>
    </div>
    <div class="keypad" role="group" aria-label="Number pad"><button type="button">1</button><button type="button">2</button><button type="button">3</button><button type="button">4</button><button type="button">5</button><button type="button">6</button><button type="button">7</button><button type="button">8</button><button type="button">9</button><span class="keypad-blank"></span><button type="button">0</button><button type="button" aria-label="Delete" class="del"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5H9.5L3.5 12l6 7H20a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m17 9.5-5 5M12 9.5l5 5"/></svg></button></div>
    <button class="btn btn-ghost cancel" type="button">Back to Pip</button>
    <p class="gate-note caption">This keeps settings and purchases safe.</p>
  </div>
  <div class="home-indicator" aria-hidden="true"><span class="home-pill"></span></div>
</div>
</body>
</html>
