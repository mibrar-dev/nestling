<meta name="viewport" content="width=390, initial-scale=1">
<title>Kid mode — Payout day · Nestling</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  html, body { width: 390px; height: 844px; margin: 0; overflow: hidden; }
  .meadow { position: absolute; left: 0; bottom: 0; width: 390px; height: 136px; z-index: 0; pointer-events: none; }
  .meadow .hill-back { fill: var(--kid-meadow); }
  .meadow .hill-front { fill: color-mix(in srgb, var(--kid-meadow) 80%, var(--surface)); }
  .meadow, .sparks, .confetti, .burst { position: absolute; z-index: 0; pointer-events: none; }
  .screen.kid > .scroll, .screen.kid > .kid-bar, .screen.kid > .k3-dock, .screen.kid > .home-indicator { position: relative; z-index: 1; }
  .lock-btn.lg, .nav-back.lg { width: 56px; height: 56px; min-width: 56px; min-height: 56px; border-radius: 18px; }
  .kid-bar { background: var(--surface); border-top: 3px solid var(--ink); padding: 12px 20px 10px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
  .kcap { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 20px; color: var(--ink-2); }
  .krow-top { display: flex; align-items: center; gap: 10px; padding: 0 20px 4px; flex-shrink: 0; }
  .krow-top .lock-btn { margin-left: auto; }

  .k10-hero { text-align: center; }
  .rain { width: 180px; height: 270px; margin: 0 auto; display: block; }
  .k10-note { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 3px solid var(--ink); border-radius: var(--r-m); box-shadow: var(--sh-kid); padding: 10px 12px; }
  .k10-ico { width: 40px; height: 40px; min-width: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: var(--leaf-tint); color: var(--leaf-ink); flex-shrink: 0; }
  .k10-t { font-family: var(--font-display); font-weight: 800; font-size: 17px; line-height: 22px; }
  .k10-s { font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 18px; color: var(--ink-2); }
  .k10-note div { min-width: 0; flex: 1; }
  .k10-fund { background: var(--coin-tint); border: 3px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--sh-kid); padding: 14px 16px; }
  .k10-fund h2 { font-family: var(--font-display); font-weight: 900; font-size: 20px; line-height: 26px; }
  .k10-amts { display: flex; justify-content: space-between; margin: 10px 0 6px; }
  .k10-amts b { font-family: var(--font-display); font-weight: 900; font-size: 17px; }
  .k10-pip { display: flex; align-items: center; gap: 12px; justify-content: center; }
  .k10-pip img { width: 72px; height: 72px; flex-shrink: 0; }
</style>
</head>
