<link rel="stylesheet" href="../tokens.css">

<style>
  html, body { width: 390px; height: 844px; margin: 0; overflow: hidden; }
  .meadow { position: absolute; left: 0; bottom: 0; width: 390px; height: 136px; z-index: 0; pointer-events: none; }
  .meadow .hill-back { fill: var(--kid-meadow); }
  .meadow .hill-front { fill: color-mix(in srgb, var(--kid-meadow) 80%, var(--surface)); }
  .meadow, .sparks, .confetti, .burst { position: absolute; z-index: 0; pointer-events: none; }
  .screen.kid > .scroll, .screen.kid > .kid-bar, .screen.kid > .k3-dock, .screen.kid > .home-indicator { position: relative; z-index: 1; }
  .lock-btn.lg, .nav-back.lg { width: 56px; height: 56px; min-width: 56px; min-height: 56px; border-radius: 18px; }
  .kid-bar { background: var(--surface); border-top: 3px solid var(--ink); padding: 12px 20px 10px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
  .kcap { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 20px; color: var(--ink-2); }
  .krow-top { display: flex; align-items: center; gap: 10px; padding: 0 20px 4px; flex-shrink: 0; }
  .krow-top .lock-btn { margin-left: auto; }

  .k11-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .k11-b { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--sh-kid); padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-family: var(--font-display); }
  .k11-b.todo { background: var(--surface); border-style: dashed; border-color: var(--ink-2); box-shadow: none; }
  .k11-medal { width: 60px; height: 60px; }
  .k11-n { font-weight: 800; font-size: 15px; line-height: 19px; text-align: center; min-height: 38px; display: flex; align-items: center; justify-content: center; }
  .k11-s { font-weight: 800; font-size: 14px; line-height: 18px; }
  .k11-b .k11-s { color: var(--leaf-ink); }
  .k11-b.todo .k11-s { color: var(--ink-2); }
  .k11-week { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--r-l); box-shadow: var(--sh-kid); padding: 14px 12px; }
  .k11-days { display: flex; gap: 4px; }
  .k11-day { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .k11-dot { width: 38px; height: 38px; border-radius: 999px; border: 3px solid var(--ink); background: var(--surface); color: var(--ink-2); display: flex; align-items: center; justify-content: center; }
  .k11-day.on .k11-dot { background: var(--leaf); color: var(--on-leaf); }
  .k11-day span { font-weight: 800; font-size: 14px; line-height: 18px; }
  .k11-why { text-align: center; margin-top: 12px; }
</style>
</head>
