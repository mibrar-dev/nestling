<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><style>
*{margin:0;box-sizing:border-box}html,body{width:1320px;height:2868px;margin:0;overflow:hidden}
body{font-family:var(--font-display),system-ui,sans-serif;background:var(--paper);color:var(--ink)}
.canvas{width:1320px;height:2868px;position:relative;display:flex;flex-direction:column;align-items:center;padding:120px 60px 0;overflow:hidden}
.kicker{font-weight:900;font-size:32px;letter-spacing:.14em;color:var(--leaf)}
h1{font-weight:900;font-size:114px;line-height:1.05;text-align:center;letter-spacing:-.02em;margin-top:18px;max-width:860px;text-wrap:balance}
.sub{font-weight:700;font-size:40px;color:var(--ink-2);margin-top:14px}
.wrap{position:relative;margin-top:60px;margin-bottom:-260px}
.phone{background:#0D0C14;border-radius:80px 80px 0 0;padding:15px 15px 0;transform:rotate(4deg);box-shadow:0 50px 110px rgba(30,27,58,.35);position:relative}
.pscreen{width:800px;height:1731px;border-radius:64px 64px 0 0;overflow:hidden;background:#fff;position:relative}
.pscreen iframe{border:0;display:block;width:390px;height:844px;transform:scale(2.05128);transform-origin:top left}
.cam{position:absolute;top:28px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#0D0C14;border-radius:999px;z-index:6}
.badge{position:absolute;background:#fff;border-radius:24px;box-shadow:0 24px 60px rgba(30,27,58,.25);padding:18px 24px;display:flex;align-items:center;gap:16px;z-index:7}
.badge .tick{width:68px;height:68px;border-radius:50%;background:var(--leaf);color:#fff;font-size:48px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.badge b{font-size:34px;display:block;line-height:1.1}.badge span{font-family:var(--font-ui);font-weight:600;font-size:26px;color:var(--ink-2)}
</style></head><body><div class="canvas">
<div class="kicker">CALM PARENTING</div>
<h1>Approve with one tap</h1>
<div class="sub">Kind notes, never nagging</div>
<div class="wrap">
<div class="phone"><div class="cam"></div><div class="pscreen"><iframe src="../../screens/P11-approvals.html" width="390" height="844" scrolling="no"></iframe></div></div>
<div class="badge" style="left:-234px;top:420px;transform:rotate(-5deg)"><div class="tick">✓</div><div><b>Approved</b><span>+15 coins</span></div></div>
<div class="badge" style="right:-234px;bottom:560px;transform:rotate(4deg)"><img src="../../assets/pip-stage-2.svg" style="width:68px;height:68px" alt=""><div><b>Pip is happy</b><span>4 happy days</span></div></div>
</div>
</div></body></html>
