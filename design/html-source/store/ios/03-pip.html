<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><style>
*{margin:0;box-sizing:border-box}html,body{width:1320px;height:2868px;margin:0;overflow:hidden}
body{font-family:var(--font-display),system-ui,sans-serif;background:#EEEBFF;color:var(--ink)}
.canvas{width:1320px;height:2868px;position:relative;display:flex;flex-direction:column;align-items:center;padding:120px 60px 0;overflow:hidden;background:linear-gradient(180deg,#EEEBFF 0%,#E3DCFF 55%,#D7C9FF 100%)}
.kicker{font-weight:900;font-size:32px;letter-spacing:.14em;color:#6A58E8}
h1{font-weight:900;font-size:112px;line-height:1.05;letter-spacing:-.02em;text-align:center;margin-top:18px;max-width:900px;text-wrap:balance}
.sub{font-weight:700;font-size:40px;color:#4A4668;margin-top:14px}
.phone{background:#0D0C14;border-radius:80px;padding:15px;box-shadow:0 50px 100px rgba(90,70,200,.35);margin-top:54px;position:relative}
.pscreen{width:760px;height:1645px;border-radius:64px;overflow:hidden;background:#fff;position:relative}
.pscreen iframe{border:0;display:block;width:390px;height:844px;transform:scale(1.94872);transform-origin:top left}
.cam{position:absolute;top:28px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#0D0C14;border-radius:999px;z-index:6}
.stages{margin-top:44px;background:#fff;border-radius:32px;padding:28px 40px;display:flex;gap:30px;align-items:flex-end;box-shadow:0 20px 60px rgba(90,70,200,.18)}
.st{display:flex;flex-direction:column;align-items:center;gap:8px}.st img{width:120px;height:120px}.st.last img{width:158px;height:158px}
.st span{font-weight:900;font-size:24px;color:#4A4668}.st.last span{color:var(--ink)}
.st.last{background:var(--lilac-tint);border-radius:22px;padding:10px 18px}
.arrow{font-size:40px;font-weight:900;color:#6A58E8;padding-bottom:40px}
</style></head><body><div class="canvas">
<div class="kicker">MOTIVATION</div>
<h1>Pip grows as they help</h1>
<div class="sub">Kind rewards, never pressure</div>
<div class="phone"><div class="cam"></div><div class="pscreen"><iframe src="../../screens/K07-evolution.html" width="390" height="844" scrolling="no"></iframe></div></div>
<div class="stages">
<div class="st"><img src="../../assets/pip-stage-1.svg" alt="Egg"><span>Egg</span></div><div class="arrow">›</div>
<div class="st"><img src="../../assets/pip-stage-2.svg" alt="Hatchling"><span>Hatchling</span></div><div class="arrow">›</div>
<div class="st"><img src="../../assets/pip-stage-3.svg" alt="Fledgling"><span>Fledgling</span></div><div class="arrow">›</div>
<div class="st last"><img src="../../assets/pip-stage-4.svg" alt="Songbird"><span>Songbird</span></div>
</div>
</div></body></html>
