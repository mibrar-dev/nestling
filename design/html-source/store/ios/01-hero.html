<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><style>
*{margin:0;box-sizing:border-box}html,body{width:1320px;height:2868px;margin:0;overflow:hidden}
body{font-family:var(--font-display),system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
.canvas{width:1320px;height:2868px;position:relative;display:flex;flex-direction:column;align-items:center;padding:120px 66px 0;overflow:hidden;background:radial-gradient(900px 500px at 50% 12%,#fff 0%,var(--paper) 60%)}
.brand{display:flex;align-items:center;gap:22px}
.brand img{width:92px;height:92px;border-radius:24px;box-shadow:0 8px 24px rgba(30,27,58,.18)}
.brand b{font-weight:900;font-size:48px;letter-spacing:-.02em}
.eyebrow{margin-top:26px;font-weight:900;font-size:32px;letter-spacing:.14em;color:var(--leaf)}
h1{font-weight:900;font-size:118px;line-height:1.05;letter-spacing:-.025em;text-align:center;margin-top:18px;max-width:1020px;text-wrap:balance}
.sub{font-weight:800;font-size:42px;line-height:1.3;color:var(--ink-2);text-align:center;margin-top:20px;max-width:900px}
.phone{background:#0D0C14;border-radius:84px;padding:16px;position:relative;box-shadow:0 60px 120px rgba(30,27,58,.38);margin-top:56px}
.pscreen{width:840px;height:1818px;border-radius:68px;overflow:hidden;background:#fff;position:relative}
.pscreen iframe{border:0;display:block;width:390px;height:844px;transform:scale(2.15385);transform-origin:top left}
.cam{position:absolute;top:32px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#0D0C14;border-radius:999px;z-index:6}
.pip-top{position:absolute;top:-112px;left:50%;transform:translateX(-8%);width:250px;z-index:7}
.coin{position:absolute;z-index:6;filter:drop-shadow(0 12px 20px rgba(0,0,0,.18))}
</style></head><body><div class="canvas">
<div class="brand"><img src="../../assets/app-icon.svg" alt="Nestling app icon"><b>Nestling</b></div>
<div class="eyebrow">FAMILY QUESTS</div>
<h1>Chores they actually want to do</h1>
<div class="sub">Quests, coins and Pip keep your family going</div>
<div style="position:relative;margin-top:110px">
<img class="pip-top" src="../../assets/pip-stage-3.svg" alt="">
<div class="phone"><div class="cam"></div><div class="pscreen"><iframe src="../../screens/K03-kid-home.html" width="390" height="844" scrolling="no" title="Kid home"></iframe></div></div>
<img class="coin" src="../../assets/coin.svg" style="left:-140px;top:260px;width:124px;transform:rotate(-12deg)" alt="">
<img class="coin" src="../../assets/coin.svg" style="right:-130px;top:620px;width:92px;transform:rotate(14deg)" alt="">
</div>
</div></body></html>
