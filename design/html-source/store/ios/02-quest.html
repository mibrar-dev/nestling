<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><style>
*{margin:0;box-sizing:border-box}html,body{width:1320px;height:2868px;margin:0;overflow:hidden}
body{font-family:var(--font-display),system-ui,sans-serif;background:#17804F;color:#fff}
.canvas{width:1320px;height:2868px;position:relative;display:flex;flex-direction:column;align-items:center;padding:120px 60px 0;overflow:hidden;background:radial-gradient(1000px 700px at 85% 20%,#22a668 0%,#17804F 55%,#0d5c38 100%)}
.kicker{font-weight:900;font-size:32px;letter-spacing:.14em;opacity:.85}
h1{font-weight:900;font-size:116px;line-height:1.05;letter-spacing:-.02em;margin-top:18px;max-width:880px;text-align:center;text-wrap:balance}
.sub{font-weight:700;font-size:42px;opacity:.92;margin-top:16px}
.stage{position:relative;margin-top:70px;width:1200px;display:flex;justify-content:center}
.phone{background:#0D0C14;border-radius:84px;padding:16px;position:relative;box-shadow:0 60px 120px rgba(0,0,0,.4);transform:rotate(-6deg)}
.pscreen{width:800px;height:1731px;border-radius:66px;overflow:hidden;background:#fff;position:relative}
.pscreen iframe{border:0;display:block;width:390px;height:844px;transform:scale(2.05128);transform-origin:top left}
.cam{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#0D0C14;border-radius:999px;z-index:6}
.chip{position:absolute;background:#fff;color:var(--ink);border-radius:999px;padding:16px 22px;font-weight:900;font-size:30px;display:flex;align-items:center;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);white-space:nowrap;z-index:7}
.chip img{width:44px;height:44px}.chip small{font-weight:800;font-size:24px;color:var(--leaf-ink);background:var(--leaf-tint);padding:6px 12px;border-radius:999px}
</style></head><body><div class="canvas">
<div class="kicker">FOR YOUR FAMILY</div>
<h1>Set a quest in seconds</h1>
<div class="sub">Ready-made ideas, tailored by age</div>
<div class="stage">
<div class="phone"><div class="cam"></div><div class="pscreen"><iframe src="../../screens/P09-quest-editor.html" width="390" height="844" scrolling="no"></iframe></div></div>
<div class="chip" style="left:-42px;top:340px;transform:rotate(-4deg)"><img src="../../assets/coin.svg" alt="">Bins out <small>+15</small></div>
<div class="chip" style="right:-42px;top:660px;transform:rotate(3deg)"><img src="../../assets/coin.svg" alt="">Make bed <small>+5</small></div>
<div class="chip" style="right:-42px;bottom:300px;transform:rotate(-2deg);background:var(--coin-tint)">40+ ideas</div>
</div>
</div></body></html>
