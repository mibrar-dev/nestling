<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><style>
*{margin:0;box-sizing:border-box}html,body{width:1320px;height:2868px;margin:0;overflow:hidden}
body{font-family:var(--font-display),system-ui,sans-serif;color:#fff}
.canvas{width:1320px;height:2868px;position:relative;display:flex;flex-direction:column;align-items:center;padding:120px 60px 0;overflow:hidden;background:linear-gradient(180deg,#131233 0%,#1E1B3A 40%,#2b2560 75%,#3a2d7a 100%)}
.star{position:absolute;background:#fff;border-radius:50%;opacity:.7}
.kicker{font-weight:900;font-size:32px;letter-spacing:.14em;color:#F4B400}
h1{font-weight:900;font-size:112px;line-height:1.05;letter-spacing:-.02em;margin-top:18px;max-width:900px;text-align:center;text-wrap:balance}
.sub{display:inline-block;margin-top:20px;font-weight:800;font-size:40px;background:rgba(244,180,0,.16);border:2px solid rgba(244,180,0,.5);color:#FFD93D;padding:14px 30px;border-radius:999px}
.wrap{position:relative;margin-top:60px}
.phone{background:#0D0C14;border-radius:80px;padding:15px;box-shadow:0 60px 120px rgba(0,0,0,.55),0 0 0 2px rgba(244,180,0,.25);position:relative}
.pscreen{width:800px;height:1731px;border-radius:64px;overflow:hidden;background:#fff;position:relative}
.pscreen iframe{border:0;display:block;width:390px;height:844px;transform:scale(2.05128);transform-origin:top left}
.cam{position:absolute;top:28px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#0D0C14;border-radius:999px;z-index:6}
.call{position:absolute;background:#fff;color:var(--ink);border-radius:22px;padding:16px 22px;font-weight:900;font-size:30px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;gap:14px;align-items:center;z-index:7;white-space:nowrap}
.call img{width:44px;height:44px}
.foot{margin-top:26px;font-family:var(--font-ui);font-weight:500;font-size:32px;color:#D9D6EC;text-align:center;max-width:900px}
</style></head><body><div class="canvas">
<div class="star" style="left:120px;top:110px;width:8px;height:8px"></div><div class="star" style="left:1050px;top:190px;width:10px;height:10px"></div><div class="star" style="left:640px;top:80px;width:6px;height:6px"></div>
<div class="kicker">POCKET MONEY</div><h1>Pocket money, sorted</h1><div class="sub">No bank card needed</div>
<div class="wrap">
<div class="phone"><div class="cam"></div><div class="pscreen"><iframe src="../../screens/P12-money.html" width="390" height="844" scrolling="no"></iframe></div></div>
<div class="call" style="left:-196px;top:460px;transform:rotate(-4deg)"><img src="../../assets/coin.svg" alt=""><span>£4.20 Sat</span></div>
<div class="call" style="right:-196px;bottom:460px;transform:rotate(3deg)">You pay your way</div>
</div>
<div class="foot">A clear ledger for your family — we keep score.</div>
</div></body></html>
