<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><style>
*{margin:0;box-sizing:border-box}html,body{width:1024px;height:500px;margin:0;overflow:hidden}
body{font-family:var(--font-display),system-ui,sans-serif}
.canvas{width:1024px;height:500px;position:relative;display:flex;align-items:center;overflow:hidden;background:linear-gradient(90deg,#FBF7F0 0%,#FFF9E8 60%,#FFF4D1 100%);padding:40px 160px 40px 60px;}
.left{width:290px;height:420px;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nestwrap{position:relative;width:270px;height:330px}
.nestwrap img.nest{width:260px;height:auto;position:absolute;bottom:15px;left:50%;transform:translateX(-50%)}
.nestwrap img.pip{width:215px;height:215px;position:absolute;bottom:95px;left:50%;transform:translateX(-50%);z-index:2}
.right{flex:1;min-width:0;padding-left:20px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand img{width:44px;height:44px;border-radius:11px}
.brand b{font-size:27px;letter-spacing:-.02em;color:var(--ink)}
.right h1{font-weight:900;font-size:60px;line-height:1.07;letter-spacing:-.02em;color:var(--ink);max-width:400px;text-wrap:balance}
.right p{font-weight:800;font-size:24px;color:var(--ink-2);margin-top:10px}
.coinA{position:absolute;right:170px;top:60px;width:44px;transform:rotate(12deg)}
</style></head><body><div class="canvas">
<div class="left"><div class="nestwrap"><img class="pip" src="../../assets/pip-stage-4.svg" alt="Pip songbird sitting in nest"><img class="nest" src="../../assets/nest.svg" alt=""></div></div>
<div class="right"><div class="brand"><img src="../../assets/app-icon.svg" alt=""><b>Nestling</b></div><h1>Chores that feel like a game.</h1><p>Family quests &amp; pocket money</p></div>
<img class="coinA" src="../../assets/coin.svg" alt="">
</div></body></html>
