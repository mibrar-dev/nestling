<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><style>
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;margin:0;overflow:hidden}
body{font-family:var(--font-display),system-ui,sans-serif;color:var(--ink)}
.canvas{width:1080px;height:1920px;position:relative;display:flex;flex-direction:column;align-items:center;padding:110px 54px 0;overflow:hidden;background:linear-gradient(180deg,#F2FAFF 0%,#EEEBFF 55%,#DCCFFF 100%)}
.kicker{font-weight:900;font-size:26px;letter-spacing:.14em;color:#6A58E8}
h1{font-weight:900;font-size:84px;line-height:1.06;text-align:center;margin-top:18px;max-width:800px;text-wrap:balance}
.sub{font-weight:700;font-size:32px;color:#4A4668;margin-top:12px}
.duo{position:relative;margin-top:50px;width:972px;height:1150px}
.phone{background:#0D0C14;border-radius:48px;padding:11px;position:absolute;box-shadow:0 40px 90px rgba(90,70,200,.35)}
.phone.back{left:60px;top:30px;transform:rotate(-6deg)}
.phone.front{right:60px;top:110px;transform:rotate(4deg);box-shadow:0 50px 100px rgba(30,27,58,.45)}
.pscreen{border-radius:36px;overflow:hidden;background:#fff;position:relative}
.pscreen.b{width:380px;height:822px}.pscreen.f{width:440px;height:952px}
.pscreen iframe{border:0;display:block;width:390px;height:844px;transform-origin:top left}
.pscreen.b iframe{transform:scale(0.97436)}.pscreen.f iframe{transform:scale(1.12821)}
.cam{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:74px;height:20px;background:#0D0C14;border-radius:999px;z-index:6}
.tag{position:absolute;z-index:8;background:var(--ink);color:#fff;font-weight:900;font-size:24px;padding:12px 22px;border-radius:999px}
.conf{position:absolute;z-index:8;left:50%;transform:translateX(-50%);bottom:0;background:#fff;border-radius:22px;padding:18px 26px;font-weight:900;font-size:28px;box-shadow:0 16px 40px rgba(90,70,200,.25);display:flex;gap:12px;align-items:center;white-space:nowrap}
.conf img{width:48px;height:48px}
</style></head><body><div class="canvas">
<div class="kicker">SATURDAY RITUAL</div><h1>Payout day, made fun</h1><div class="sub">Celebrate together, keep saving</div>
<div class="duo">
<div class="phone back"><div class="cam"></div><div class="pscreen b"><iframe src="../../screens/P13-payout.html" width="390" height="844" scrolling="no"></iframe></div></div>
<div class="phone front"><div class="cam"></div><div class="pscreen f"><iframe src="../../screens/K10-payout-day.html" width="390" height="844" scrolling="no"></iframe></div></div>
<div class="tag" style="left:40px;top:0">Parent view</div>
<div class="tag" style="right:50px;top:70px;background:#17804F">Child view</div>
<div class="conf"><img src="../../assets/coin.svg" alt="">Thanks Mum! · £1 to Lego fund</div>
</div>
</div></body></html>
