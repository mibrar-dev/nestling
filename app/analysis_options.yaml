include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false

    # Fires on every `this.field` initializing formal - the idiomatic Flutter
    # widget constructor pattern - and then asks you to remove the
    # constructor's own class name, which cannot be done. There is no way to
    # write `const Foo({required this.bar})` without tripping it.
    unnecessary_type_name_in_constructor: false
